name: Generic onboarding smoke

on:
  push:
    branches:
      - generic-onboarding-v1
    paths:
      - ".github/workflows/generic-onboarding-smoke.yml"
      - "src/discover.py"
      - "src/build_history.py"
      - "src/process_tour.py"
      - "src/event_queue.py"
      - "src/analyze_tournament.py"
      - "src/render_site.py"
      - "src/render_high_loft.py"
      - "src/write_recap.py"
      - "src/run_batched_recap.py"
      - "configs/tour-1534.json"

permissions:
  contents: read

jobs:
  tour-1534:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: generic-onboarding-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Compile generic pipeline
        run: |
          python -m py_compile \
            src/discover.py src/build_history.py src/process_tour.py src/event_queue.py \
            src/render_site.py src/render_high_loft.py src/write_recap.py src/run_batched_recap.py
      - name: Process Tour 1534 in isolated data root
        run: python src/process_tour.py --config configs/tour-1534.json --data-root data/leagues/tour-1534
      - name: Audit deterministic result and queue semantics
        run: |
          python - <<'PY'
          import json, subprocess, tempfile
          from pathlib import Path
          hpath=Path('data/leagues/tour-1534/history.json')
          h=json.loads(hpath.read_text())
          completed=h['completedEvents']
          assert completed, 'No completed events discovered'
          assert h['tour']['id']==1534
          assert h['missingAnalysisEventIds']==[]
          assert h['scopes']['all']['players'], 'No players in all-data scope'
          latest=int(completed[0]['id'])
          print('TOUR1534 completed=',len(completed),'latest=',latest,'players=',len(h['scopes']['all']['players']))
          print('event IDs newest-first=',[int(e['id']) for e in completed])
          with tempfile.TemporaryDirectory() as td:
              td=Path(td); state=td/'published-events.json'
              out=subprocess.check_output([
                  'python','src/event_queue.py','plan',str(hpath),
                  '--state',str(state),'--write-state'
              ],text=True)
              p=json.loads(out)
              assert p['queueLength']==len(completed)
              oldest=p['missingEventIdsOldestFirst'][0]
              subprocess.check_call([
                  'python','src/event_queue.py','mark',str(hpath),
                  '--state',str(state),'--event',str(oldest)
              ])
              p2=json.loads(subprocess.check_output([
                  'python','src/event_queue.py','plan',str(hpath),'--state',str(state)
              ],text=True))
              assert p2['queueLength']==len(completed)-1
              assert oldest not in p2['missingEventIdsOldestFirst']
              marker=td/'legacy.txt'; marker.write_text(str(latest)+'\n')
              migrated=td/'migrated.json'
              p3=json.loads(subprocess.check_output([
                  'python','src/event_queue.py','plan',str(hpath),
                  '--state',str(migrated),'--legacy-marker',str(marker),'--write-state'
              ],text=True))
              assert p3['queueLength']==0, p3
              print('QUEUE TEST PASSED: all missing -> mark oldest -> legacy latest migrates all published')
          sg_players=[p for p in h['scopes']['5']['players'] if any((p.get('sg') or {}).get(k) is not None for k in ('tee','approach','shortGame','putting'))]
          print('LAST5 players with SG=',len(sg_players),'of',len(h['scopes']['5']['players']))
          PY
      - name: Runtime-render generic large-field HTML with deterministic placeholder copy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path('data/leagues/tour-1534')
          h=json.loads((root/'history.json').read_text())
          scopes={}
          for name,scope in h['scopes'].items():
              scopes[name]={
                  'leagueSummary':'Placeholder summary.',
                  'leagueBullets':['One','Two','Three'],
                  'profiles':[{'name':p['name'],'tagline':'TEST GOLF IDENTITY','profile':'Placeholder profile copy.'} for p in scope['players']],
              }
          (root/'league-copy.json').write_text(json.dumps({
              'schemaVersion':3,'defaultScope':h['defaultScope'],'availableScopes':h['availableScopes'],'scopes':scopes
          }))
          latest=int(h['completedEvents'][0]['id'])
          a=json.loads((root/'analysis'/f'{latest}.json').read_text())
          completed=[p for p in a['players'] if p.get('completed')]
          copy={
              'thirtySeconds':'Placeholder tournament summary.',
              'latestTournamentTeaser':'Placeholder tournament teaser.',
              'stateOfLeague':'Placeholder state of league.',
              'carnage':[{'name':x['name'],'commentary':'Placeholder carnage.'} for x in a['carnage']],
              'players':[{'name':p['name'],'tagline':'TEST ROUND IDENTITY','body':'Placeholder round breakdown.'} for p in completed],
          }
          (root/'copy').mkdir(exist_ok=True)
          (root/'copy'/f'{latest}.json').write_text(json.dumps(copy))
          print('Prepared placeholder copy for runtime renderer test')
          PY
          python src/render_site.py --config configs/tour-1534.json --data-root data/leagues/tour-1534 --output site-tour-1534-smoke
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('data/leagues/tour-1534/history.json').read_text())
          latest=str(h['completedEvents'][0]['id'])
          index=Path('site-tour-1534-smoke/index.html').read_text()
          recap=Path(f'site-tour-1534-smoke/recaps/{latest}.html').read_text()
          assert 'CRUSH' in index.upper()
          assert 'HIGH LOFT' not in index.upper()
          for marker in ('data-profile-search','data-profile-more','data-archive-more','data-season-scroll-note'):
              assert marker in index, marker
          for marker in ('data-carnage-search','data-round-player-search','data-carnage-more','data-player-more','data-round-expand'):
              assert marker in recap, marker
          print('GENERIC RENDER RUNTIME PASSED')
          PY
# trigger latest renderer
