name: Patch batched writer output logging

on:
  push:
    branches: [batched-ai-checkpoints-v1]
    paths:
      - ".github/workflows/patch-batched-writer-print.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batched-ai-checkpoints-v1
          fetch-depth: 0
      - name: Patch output-path logging
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/write_recap_batched.py')
          text=path.read_text()
          old='    print(f"Wrote complete batched recap for tournament {tournament_id} with model {args.model}: {out.relative_to(ROOT)}")\n'
          new='    display_out = out.relative_to(ROOT) if out.is_relative_to(ROOT) else out\n    print(f"Wrote complete batched recap for tournament {tournament_id} with model {args.model}: {display_out}")\n'
          if old not in text:
              raise SystemExit('target print line not found')
          path.write_text(text.replace(old,new,1))
          PY
          python -m py_compile src/write_recap_batched.py
      - name: Commit fix
        run: |
          git config user.name "high-loft-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/write_recap_batched.py
          git commit -m "Handle external batched recap output paths"
          git pull --rebase origin batched-ai-checkpoints-v1
          git push origin HEAD:batched-ai-checkpoints-v1
