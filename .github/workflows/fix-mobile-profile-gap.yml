name: Fix renderer mobile profile spacing

on:
  push:
    paths:
      - ".github/workflows/fix-mobile-profile-gap.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch scalable renderer mobile search sizing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/render_high_loft_large_field.py')
          text = path.read_text()
          old = '@media(max-width:700px){{.large-field-tools{{align-items:stretch;flex-direction:column}}.large-field-status{{text-align:left}}.player-search{{min-width:100%}}}}'
          new = '@media(max-width:820px){{.scouting-head .scouting-player-search{{flex:0 0 auto;min-width:0;width:100%;max-width:none;align-self:stretch}}}}\n@media(max-width:700px){{.large-field-tools{{align-items:stretch;flex-direction:column}}.large-field-status{{text-align:left}}.player-search{{min-width:100%}}}}'
          if old not in text and new not in text:
              raise SystemExit('Could not find mobile large-field CSS marker')
          if new not in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          final = path.read_text()
          assert new in final
          print('Renderer mobile scouting search rule present')
          PY
          python -m py_compile src/render_high_loft_large_field.py
      - name: Commit renderer fix
        run: |
          git config user.name "high-loft-auto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/render_high_loft_large_field.py
          if git diff --cached --quiet; then
            echo "Already fixed"
            exit 0
          fi
          git commit -m "Fix mobile scouting search spacing"
          git pull --rebase origin main
          git push origin HEAD:main
