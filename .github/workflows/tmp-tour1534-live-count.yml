name: Temporary Tour 1534 live count

on:
  issues:
    types: [opened]

jobs:
  count:
    if: github.event.issue.title == 'TEMP TOUR 1534 LIVE COUNT'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Count live SGT events
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'src')
          import discover
          tour_id = 1534
          html = discover.fetch_events_html(tour_id)
          data = discover.parse_events(html, tour_id, "crush's par3 and exec league")
          active = data.get('active', [])
          completed = data.get('completed', [])
          print(f'TOUR1534_COUNTS active={len(active)} completed={len(completed)} total={len(active)+len(completed)}')
          print('TOUR1534_COMPLETED_IDS', ','.join(str(e['id']) for e in completed))
          print('TOUR1534_ACTIVE_IDS', ','.join(str(e['id']) for e in active))
          for e in completed:
              print(f"EVENT {e['id']} | {e.get('date')} | {e.get('tourName')} | {e.get('course')}")
          PY
