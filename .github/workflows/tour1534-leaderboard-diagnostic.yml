name: Tour 1534 leaderboard diagnostic

on:
  push:
    branches: [tour1534-variable-hole-active]
    paths:
      - ".github/workflows/tour1534-leaderboard-diagnostic.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tour1534-variable-hole-active
      - name: Install deps
        run: pip install beautifulsoup4
      - name: Inspect missing stats case
        run: |
          PYTHONPATH=src python - <<'PY'
          from bs4 import BeautifulSoup
          from export_tournament import export_tournament
          from analyze_tournament import analyze, parse_stats

          tid=66654
          raw=export_tournament(tid)
          result=analyze(raw)
          missing=[p for p in result['players'] if not any(v is not None for v in p['sg'].values())]
          print('missing_count=',len(missing))
          for player in missing:
              print('MISSING_PLAYER',player['id'],player['name'],player['leaderboard'])
              rp=next(p for p in raw['players'] if p['id']==player['id'])
              html=rp.get('stats') or ''
              print('stats_html_bytes=',len(html),'errors=',rp.get('errors'))
              soup=BeautifulSoup(html,'html.parser')
              print('tables=',[(t.get('class'), len(t.find_all('tr'))) for t in soup.find_all('table')])
              for row in soup.find_all('tr')[:80]:
                  cells=[' '.join(c.stripped_strings) for c in row.find_all(['td','th'],recursive=False)]
                  if cells: print('ROW',cells)
              print('HTML_SNIP',html[:6000].replace('\n',' '))
          assert len(missing)==1, [p['name'] for p in missing]
          PY
