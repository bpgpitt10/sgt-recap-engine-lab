name: Tour 1534 leaderboard diagnostic

on:
  push:
    branches: [tour1534-variable-hole-active]
    paths:
      - ".github/workflows/tour1534-leaderboard-diagnostic.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: pip install beautifulsoup4
      - name: Inspect Aloha net scoring
        run: |
          python - <<'PY'
          import re, urllib.request, http.cookiejar
          from bs4 import BeautifulSoup
          BASE='https://simulatorgolftour.com'
          tid=70322
          pid=2006
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          opener.addheaders=[('User-Agent','Mozilla/5.0'),('Accept-Language','en-US,en;q=0.9')]
          page=f'{BASE}/tournament/{tid}'
          opener.open(page,timeout=30).read()
          for suffix in ('','/net'):
              req=urllib.request.Request(f'{BASE}/sgt-api/leaderboard/{tid}{suffix}',headers={'Referer':page,'X-Requested-With':'XMLHttpRequest'})
              html=opener.open(req,timeout=30).read().decode('utf-8','replace')
              soup=BeautifulSoup(html,'html.parser')
              row=None
              for tr in soup.find_all('tr'):
                  link=tr.find('a',href=re.compile(rf'/scorecard/{tid}/{pid}$'))
                  if link:
                      row=tr; break
              print('\n', 'NET' if suffix else 'GROSS', 'LEADERBOARD')
              print('class=',row.get('class') if row else None)
              print('cells=', [' '.join(td.stripped_strings) for td in row.find_all(['td','th'],recursive=False)] if row else None)
              print(str(row)[:5000].replace('\n',' ') if row else 'NO ROW')
          referer=f'{BASE}/scorecard/{tid}/{pid}'
          req=urllib.request.Request(f'{BASE}/sgt-api/scorecard/{tid}/{pid}/indv',headers={'Referer':referer,'X-Requested-With':'XMLHttpRequest'})
          html=opener.open(req,timeout=30).read().decode('utf-8','replace')
          soup=BeautifulSoup(html,'html.parser')
          print('\nSCORECARD')
          for table in soup.select('table.scorecard-table'):
              for row in table.find_all('tr'):
                  cells=[' '.join(td.stripped_strings) for td in row.find_all(['td','th'],recursive=False)]
                  if cells: print(row.get('class'), cells)
          print('\nRAW SCORE ROWS')
          for row in soup.select('tr.score-row'):
              print(str(row)[:5000].replace('\n',' '))
          PY
