# focused smoke test; no stale history dependency
name: One-time recap header search renderer patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recap-header-search-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out engine
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch renderer
        run: python tools/patch_recap_header_search.py
      - name: Verify renderer
        run: |
          python -m py_compile src/render_high_loft_large_field.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'src')
          import render_high_loft_large_field as m

          html = '''<html><head></head><body>
          <section class="section carnage-section" id="carnage"><div class="wrap"><div class="sectionhead marked"><div class="section-title"><span class="section-mark">02</span><div><div class="section-kicker">Everybody's worst hole.</div><h2>Carnage Board</h2></div></div><p class="sectionlead">Old right-side tagline.</p></div><div class="hole-grid"><article data-carnage-card><span class="player-name">Alpha</span></article></div></div></section>
          <section class="section player-section" id="players"><div class="wrap"><div class="sectionhead marked"><div class="section-title"><span class="section-mark">03</span><div><div class="section-kicker">Net order. Gross context.</div><h2>Player by player</h2></div></div><p class="sectionlead">Old right-side tagline.</p></div><div class="recap-players expanded"><article data-player-card><h3>Alpha <span>NET -1</span></h3></article></div></div></section>
          </body></html>'''
          out = m.large_field_recap(html)
          assert 'data-carnage-search' in out
          assert 'data-round-player-search' in out
          assert out.count('recap-search-head') >= 2
          assert 'Old right-side tagline.' not in out
          assert 'data-carnage-grid' in out
          assert 'data-round-player-grid' in out
          print('RECAP HEADER SEARCH SMOKE TEST PASSED')
          PY
      - name: Publish renderer change
        run: |
          git config user.name "high-loft-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/render_high_loft_large_field.py
          git commit -m "Put tournament player search in section headers"
          git push origin HEAD:main
