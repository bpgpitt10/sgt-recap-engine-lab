# rerun after net-zero parser fix
name: Tour 1534 deterministic dry run

on:
  push:
    branches: [tour1534-variable-hole-active]
    paths:
      - ".github/workflows/tour1534-deterministic-dry-run.yml"

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tour1534-variable-hole-active
          fetch-depth: 0
      - name: Install dependencies
        run: pip install beautifulsoup4
      - name: Reset to isolated Tour 1534 workspace
        run: |
          rm -rf data/analysis data/work data/discovery data/history.json
          cat > config.json <<'JSON'
          {
            "tourId": 1534,
            "tourName": "Tour 1534 deterministic dry run",
            "ignoreEventIds": [],
            "pinnedCompletedEvents": [],
            "history": {
              "defaultScope": "all",
              "scopes": ["all"],
              "excludeEventIds": []
            },
            "competitionOverrides": {},
            "site": {"recapSlugs": {}}
          }
          JSON
      - name: Process every currently completed event
        run: PYTHONPATH=src python src/process_tour.py --refresh-all
      - name: Build deterministic audit report
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path

          history=json.loads(Path('data/history.json').read_text())
          discovery=json.loads(Path('data/discovery/1534.json').read_text())
          rows=[]
          problems=[]
          total_finishers=0
          total_stats=0
          total_shots=0
          for event in discovery.get('completed',[]):
              eid=int(event['id'])
              analysis=json.loads(Path(f'data/analysis/{eid}.json').read_text())
              raw=json.loads(Path(f'data/work/tournaments/{eid}.json').read_text())
              v=analysis['validation']
              completed=v['completedPlayers']
              total_finishers += completed
              total_stats += v['playersWithStats']
              total_shots += v['playersWithShots']
              holes=sorted({p['scorecard'].get('holesPlayed') for p in analysis['players'] if p.get('completed')})
              source_error_players=[p['name'] for p in analysis['players'] if p.get('sourceErrors')]
              row={
                  'id':eid,
                  'name':event.get('tourName'),
                  'course':event.get('course'),
                  'date':event.get('date'),
                  'leaderboardRowsGross':len(raw['leaderboard']['grossOrder']),
                  'leaderboardRowsNet':len(raw['leaderboard']['netOrder']),
                  'officialFinishersExported':len(raw['players']),
                  'completedPlayers':completed,
                  'holesPlayed':holes,
                  'variableHoleFinishers':v.get('variableHoleFinishers',0),
                  'playersWithStats':v['playersWithStats'],
                  'playersWithShots':v['playersWithShots'],
                  'carnageEntries':len(analysis['carnage']),
                  'netWinner':(analysis['winners']['net'] or {}).get('name'),
                  'grossWinner':(analysis['winners']['gross'] or {}).get('name'),
                  'sourceErrorPlayers':source_error_players,
              }
              rows.append(row)
              if len(raw['players']) != completed:
                  problems.append(f'{eid}: exported {len(raw["players"])} != completed {completed}')
              if len(analysis['leaderboard']['net']) != completed:
                  problems.append(f'{eid}: net standings {len(analysis["leaderboard"]["net"])} != completed {completed}')
              if len(analysis['leaderboard']['gross']) != completed:
                  problems.append(f'{eid}: gross standings {len(analysis["leaderboard"]["gross"])} != completed {completed}')
              if len(analysis['carnage']) != completed:
                  problems.append(f'{eid}: carnage {len(analysis["carnage"])} != completed {completed}')
              if source_error_players:
                  problems.append(f'{eid}: source errors for {source_error_players}')
          report={
              'tourId':1534,
              'completedEvents':len(rows),
              'activeEvents':len(discovery.get('active',[])),
              'totalFinishers':total_finishers,
              'statsCoverage':f'{total_stats}/{total_finishers}',
              'shotCoverage':f'{total_shots}/{total_finishers}',
              'missingAnalysisEventIds':history.get('missingAnalysisEventIds'),
              'problems':problems,
              'events':rows,
          }
          Path('tour1534-audit.json').write_text(json.dumps(report,indent=2)+'\n')
          print('\n=== TOUR 1534 AUDIT ===')
          print(json.dumps(report,indent=2))
          if history.get('missingAnalysisEventIds'):
              raise SystemExit('Missing deterministic analyses')
          if problems:
              raise SystemExit('Deterministic audit found problems: '+repr(problems))
          PY
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour1534-deterministic-audit
          path: |
            tour1534-audit.json
            data/discovery/1534.json
            data/history.json
