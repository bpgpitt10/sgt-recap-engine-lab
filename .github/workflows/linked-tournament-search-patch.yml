name: One-time linked tournament search patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/linked-tournament-search-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch renderer
        run: python tools/patch_linked_tournament_search.py
      - name: Verify renderer
        run: |
          python -m py_compile src/render_high_loft_large_field.py
          grep -q "syncTournamentSearch" src/render_high_loft_large_field.py
          ! grep -q "f'<span>Search player</span>'" src/render_high_loft_large_field.py
      - name: Publish renderer change
        run: |
          git config user.name "high-loft-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/render_high_loft_large_field.py
          git commit -m "Link tournament player searches"
          git push origin HEAD:main
