name: Export full SGT tournament

on:
  workflow_dispatch:
    inputs:
      tournament_id:
        description: "SGT tournament ID"
        required: true
        default: "67350"
  push:
    branches: [main]
    paths:
      - "src/export_tournament.py"
      - ".github/workflows/export-tournament.yml"

jobs:
  export-tournament:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Export tournament
        env:
          TOURNAMENT_ID: ${{ github.event.inputs.tournament_id || '67350' }}
        run: python src/export_tournament.py "$TOURNAMENT_ID"

      - name: Upload tournament package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tournament-${{ github.event.inputs.tournament_id || '67350' }}
          path: |
            data/tournaments/
            data/debug/
          if-no-files-found: warn
