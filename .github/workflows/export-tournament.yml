name: Export and analyze SGT tournament

on:
  workflow_dispatch:
    inputs:
      tournament_id:
        description: "SGT tournament ID"
        required: true
        default: "55704"
  push:
    branches: [main]
    paths:
      - "src/export_tournament.py"
      - "src/analyze_tournament.py"
      - ".github/workflows/export-tournament.yml"

jobs:
  export-analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Export tournament
        env:
          TOURNAMENT_ID: ${{ github.event.inputs.tournament_id || '55704' }}
        run: python src/export_tournament.py "$TOURNAMENT_ID"

      - name: Build deterministic analysis
        env:
          TOURNAMENT_ID: ${{ github.event.inputs.tournament_id || '55704' }}
        run: |
          case "$TOURNAMENT_ID" in
            55704)
              python src/analyze_tournament.py "data/tournaments/$TOURNAMENT_ID.json" \
                --expect-net-winner KeithK75 \
                --expect-gross-winner KeithK75
              ;;
            67350)
              python src/analyze_tournament.py "data/tournaments/$TOURNAMENT_ID.json" \
                --expect-net-winner CDickerson \
                --expect-gross-winner CDickerson
              ;;
            *)
              python src/analyze_tournament.py "data/tournaments/$TOURNAMENT_ID.json"
              ;;
          esac

      - name: Validate High Loft fixture
        if: ${{ (github.event.inputs.tournament_id || '55704') == '55704' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/analysis/55704.json').read_text())
          assert data['validation']['completedPlayers'] == 8, data['validation']
          assert len(data['leaderboard']['net']) == 8
          assert len(data['leaderboard']['gross']) == 8
          print('HIGH LOFT ANALYSIS PASSED')
          print(json.dumps({
              'netWinner': data['winners']['net'],
              'grossWinner': data['winners']['gross'],
              'validation': data['validation'],
          }, indent=2))
          PY

      - name: Commit small derived analysis
        env:
          TOURNAMENT_ID: ${{ github.event.inputs.tournament_id || '55704' }}
        run: |
          git config user.name "sgt-recap-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "data/analysis/$TOURNAMENT_ID.json"
          if ! git diff --cached --quiet; then
            git commit -m "Store analysis for tournament $TOURNAMENT_ID"
            git push
          fi

      - name: Upload raw and analyzed package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tournament-${{ github.event.inputs.tournament_id || '55704' }}
          path: |
            data/tournaments/
            data/analysis/
            data/debug/
          if-no-files-found: warn
