name: One-time scouting header search renderer patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scouting-header-search-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch renderer
        run: python tools/patch_scouting_header_search.py
      - name: Verify renderer
        run: |
          python -m py_compile src/render_high_loft_large_field.py
          grep -q 'scouting-player-search' src/render_high_loft_large_field.py
          grep -q 'placeholder="Search player…"' src/render_high_loft_large_field.py
          ! grep -q 'Find a player</span><input type="search" data-profile-search' src/render_high_loft_large_field.py
      - name: Publish renderer change
        run: |
          git config user.name "high-loft-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/render_high_loft_large_field.py
          git commit -m "Move scouting search into section header"
          git push origin HEAD:main
