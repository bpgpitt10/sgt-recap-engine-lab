# trigger regression
name: Apply net-zero score parsing

on:
  push:
    branches: [tour1534-variable-hole-active]
    paths:
      - ".github/workflows/apply-net-zero-score.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tour1534-variable-hole-active
          fetch-depth: 0
      - name: Install dependencies
        run: pip install beautifulsoup4
      - name: Apply net-zero patch
        run: python tools/patch_net_zero_score.py
      - name: Compile
        run: python -m py_compile src/analyze_tournament.py
      - name: Live Aloha, Bougle, Trosper regression
        run: |
          PYTHONPATH=src python - <<'PY'
          from export_tournament import export_tournament
          from analyze_tournament import analyze

          cases = [
              (70322, 44, 0),
              (65301, 18, 18),
              (70248, 9, 0),
          ]
          for tid, finishers, variable in cases:
              print(f'\n=== REGRESSION {tid} ===')
              raw=export_tournament(tid)
              result=analyze(raw)
              v=result['validation']
              print('validation=',v)
              print('winners=',result['winners'])
              assert len(raw['players']) == finishers
              assert v['completedPlayers'] == finishers
              assert v['variableHoleFinishers'] == variable
              if tid == 70322:
                  markydur=next(p for p in result['players'] if p['name']=='Markydur')
                  print('Markydur=',markydur['leaderboard'],markydur['scorecard']['net'],markydur['scorecard']['netToPar'])
                  assert markydur['scorecard']['net'] == 24
                  assert markydur['scorecard']['netToPar'] == -30
              if tid == 65301:
                  assert sorted({p['scorecard']['holesPlayed'] for p in result['players']}) == [15]
              if tid == 70248:
                  assert sorted({p['scorecard']['holesPlayed'] for p in result['players']}) == [18]
          PY
      - name: Commit parser change
        run: |
          git config user.name "high-loft-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/analyze_tournament.py
          git commit -m "Handle zero net scores rendered as dashes"
          git pull --rebase origin tour1534-variable-hole-active
          git push origin HEAD:tour1534-variable-hole-active
