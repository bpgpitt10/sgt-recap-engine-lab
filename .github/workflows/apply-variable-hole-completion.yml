name: Apply variable-hole completion

on:
  push:
    branches: [tour1534-variable-hole-active]
    paths:
      - ".github/workflows/apply-variable-hole-completion.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tour1534-variable-hole-active
          fetch-depth: 0
      - name: Install dependencies
        run: pip install beautifulsoup4
      - name: Apply parser patch
        run: python tools/patch_variable_hole_completion.py
      - name: Compile
        run: python -m py_compile src/export_tournament.py src/analyze_tournament.py
      - name: Live Bougle and Trosper regression
        run: |
          PYTHONPATH=src python - <<'PY'
          from export_tournament import export_tournament
          from analyze_tournament import analyze

          cases = [
              (65301, 18, 18, '1234567791234567', '1234567791234567'),
              (70248, 9, 0, 'KeithK75', 'KeithK75'),
          ]
          for tid, expected_finishers, expected_variable, expected_net, expected_gross in cases:
              print(f'\n=== REGRESSION {tid} ===')
              raw = export_tournament(tid)
              result = analyze(raw)
              v = result['validation']
              print('validation=', v)
              print('winners=', result['winners'])
              assert len(raw['players']) == expected_finishers, (tid, len(raw['players']))
              assert v['completedPlayers'] == expected_finishers, (tid, v)
              assert v['variableHoleFinishers'] == expected_variable, (tid, v)
              assert result['winners']['net']['name'] == expected_net, (tid, result['winners'])
              assert result['winners']['gross']['name'] == expected_gross, (tid, result['winners'])
              if tid == 65301:
                  played = sorted({p['scorecard']['holesPlayed'] for p in result['players'] if p['completed']})
                  print('Bougle holes played=', played)
                  assert played == [15], played
              if tid == 70248:
                  played = sorted({p['scorecard']['holesPlayed'] for p in result['players'] if p['completed']})
                  print('Trosper holes played=', played)
                  assert played == [18], played
          PY
      - name: Commit parser changes to feature branch
        run: |
          git config user.name "high-loft-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/export_tournament.py src/analyze_tournament.py
          git commit -m "Support official finishers and variable-hole events"
          git push origin HEAD:tour1534-variable-hole-active
