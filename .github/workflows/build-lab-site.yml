name: Build complete automated lab site

on:
  workflow_dispatch:
    inputs:
      model:
        description: "OpenAI model for recap copy"
        required: true
        default: "gpt-5.6-luna"
  push:
    branches: [main]
    paths:
      - "src/write_all_recaps.py"
      - "src/render_site.py"
      - ".github/workflows/build-lab-site.yml"

jobs:
  build-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Require OpenAI API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is missing."
            exit 1
          fi

      - name: Regenerate every recap with as-of-event history
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ github.event.inputs.model || 'gpt-5.6-luna' }}
        run: python src/write_all_recaps.py

      - name: Render static lab site
        run: python src/render_site.py --output site

      - name: Validate complete site
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          history = json.loads(Path('data/history.json').read_text())
          assert Path('site/index.html').exists()
          latest = int(history['completedEvents'][0]['id'])
          assert Path(f'site/recaps/{latest}.html').exists()
          for event in history['completedEvents']:
              event_id = int(event['id'])
              assert Path(f'data/copy/{event_id}.json').exists(), event_id
              assert Path(f'data/facts/{event_id}.json').exists(), event_id
              assert Path(f'site/recaps/{event_id}.html').exists(), event_id
          assert '59463' not in history['scopes']['all']['eventIds']
          html = Path('site/index.html').read_text()
          assert 'Last 5' in html and 'Last 10' in html and 'Last 20' in html
          assert 'League Snapshot' in html and 'Scouting Files' in html
          print('COMPLETE LAB SITE PASSED')
          print('Latest:', latest)
          print('Recaps:', len(history['completedEvents']))
          PY

      - name: Commit generated recaps and static site
        run: |
          git config user.name "sgt-recap-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/copy/ data/facts/ site/
          if ! git diff --cached --quiet; then
            git commit -m "Build complete automated lab site"
            git push
          fi

      - name: Upload full site artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automated-league-site
          path: site/
          if-no-files-found: error
