name: Tighten batched recap context

on:
  push:
    branches: [batched-ai-checkpoints-v1]
    paths:
      - ".github/workflows/patch-batched-context.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batched-ai-checkpoints-v1
          fetch-depth: 0
      - name: Narrow batch context to requested players
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/write_recap_batched.py')
          text=path.read_text()
          old='''- This request is ONLY for the supplied subset of players.\n- Return exactly one players entry for every player in playersNetOrder, in that exact order.\n- Return exactly one carnage entry for every player in carnageOrder, in that exact order.\n'''
          new='''- This request is ONLY for the supplied subset of players.\n- In this mode, "every completed player" means ONLY the names supplied in playersNetOrder for this batch, not the whole tournament.\n- Return exactly one players entry for every player in playersNetOrder, in that exact order, and NEVER return a player card for any other name.\n- Return exactly one carnage entry for every player in carnageOrder, in that exact order, and NEVER return Carnage copy for any other name.\n- Winner names outside playersNetOrder are context only; do not create cards for them.\n'''
          if old not in text:
              raise SystemExit('batch instruction block not found')
          text=text.replace(old,new,1)
          old='''    return {\n        "league": full_facts.get("league"),\n        "tournament": full_facts.get("tournament"),\n        "winners": full_facts.get("winners"),\n        "leaderboard": full_facts.get("leaderboard"),\n        "carnageOrder": [item for item in full_facts.get("carnageOrder", []) if item.get("name") in names],\n'''
          new='''    leaderboard = full_facts.get("leaderboard") or {}\n    return {\n        "league": full_facts.get("league"),\n        "tournament": full_facts.get("tournament"),\n        "winners": full_facts.get("winners"),\n        "leaderboard": {\n            "net": [item for item in leaderboard.get("net", []) if item.get("name") in names],\n            "gross": [item for item in leaderboard.get("gross", []) if item.get("name") in names],\n        },\n        "carnageOrder": [item for item in full_facts.get("carnageOrder", []) if item.get("name") in names],\n'''
          if old not in text:
              raise SystemExit('subset facts block not found')
          path.write_text(text.replace(old,new,1))
          PY
          python -m py_compile src/write_recap_batched.py
      - name: Commit context tightening
        run: |
          git config user.name "high-loft-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/write_recap_batched.py
          git commit -m "Limit recap batches to selected player context"
          git pull --rebase origin batched-ai-checkpoints-v1
          git push origin HEAD:batched-ai-checkpoints-v1
