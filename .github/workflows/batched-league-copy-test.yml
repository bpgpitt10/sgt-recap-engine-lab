name: Batched league copy integration test

on:
  push:
    branches: [batched-league-copy-v1]
    paths:
      - "src/write_league_copy_batched.py"
      - "src/run_batched_league_copy.py"
      - ".github/workflows/batched-league-copy-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batched-league-copy-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile batched league writer
        run: python -m py_compile src/write_league_copy_batched.py src/run_batched_league_copy.py
      - name: Require OpenAI test key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"

      - name: Generate one High Loft profile batch then intentionally stop
        env: &openai_env
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4-mini-2026-03-17
          OPENAI_FALLBACK_MODEL: gpt-5.6-luna
          OPENAI_TRANSIENT_ATTEMPTS: "6"
          OPENAI_REQUEST_TIMEOUT_SECONDS: "120"
        run: |
          rm -rf data/test-league-checkpoints data/test-league-copy.json data/test-league-facts.json
          set +e
          python src/run_batched_league_copy.py data/history.json \
            --checkpoint-dir data/test-league-checkpoints \
            --output data/test-league-copy.json \
            --facts-output data/test-league-facts.json \
            --batch-size 6 \
            --max-new-batches 1
          status=$?
          set -e
          test "$status" -ne 0
          test ! -f data/test-league-copy.json
          count=$(find data/test-league-checkpoints -name 'batch-*.json' | wc -l)
          test "$count" -eq 1
          echo "One validated profile batch survived intentional interruption."

      - name: Resume and finish real High Loft rolling windows
        env: *openai_env
        run: |
          python src/run_batched_league_copy.py data/history.json \
            --checkpoint-dir data/test-league-checkpoints \
            --output data/test-league-copy.json \
            --facts-output data/test-league-facts.json \
            --batch-size 6
          python - <<'PY'
          import json
          from pathlib import Path
          history=json.loads(Path('data/history.json').read_text())
          copy=json.loads(Path('data/test-league-copy.json').read_text())
          manifest=json.loads(Path('data/test-league-checkpoints/manifest.json').read_text())
          assert manifest['complete'] is True, manifest
          assert manifest['reusedBatches'] >= 1, manifest
          assert set(copy['scopes']) == set(history['availableScopes'])
          for scope in history['availableScopes']:
              expected=len(history['scopes'][scope]['players'])
              actual=len(copy['scopes'][scope]['profiles'])
              assert actual == expected, (scope, expected, actual)
              assert len(copy['scopes'][scope]['leagueBullets']) == 3
          print('REAL HIGH LOFT RESUME PASS', json.dumps(manifest, indent=2))
          PY

      - name: Prove completed High Loft replay makes zero new profile batches
        env: *openai_env
        run: |
          python src/run_batched_league_copy.py data/history.json \
            --checkpoint-dir data/test-league-checkpoints \
            --output data/test-league-copy-replay.json \
            --batch-size 6
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('data/test-league-checkpoints/manifest.json').read_text())
          assert manifest['newBatches'] == 0, manifest
          assert manifest['reusedBatches'] == sum(w['batchCount'] for w in manifest['windows']), manifest
          print('HIGH LOFT FULL REUSE PASS')
          PY

      - name: Build 56-profile scale history
        run: |
          python - <<'PY'
          import copy, json
          from pathlib import Path
          history=json.loads(Path('data/history.json').read_text())
          base=history['scopes']['all']['players']
          players=[]
          for i in range(56):
              p=copy.deepcopy(base[i % len(base)])
              p['id']=900000+i
              p['name']=f"ScalePlayer{i+1:02d}"
              players.append(p)
          players.sort(key=lambda p: (p.get('avgNet', 9999), p['name']))
          scale={
              'schemaVersion': 2,
              'tour': {'id': 99999, 'name': 'Large Field Scale Test'},
              'scopeDefinition': history['scopeDefinition'],
              'defaultScope': 'all',
              'availableScopes': ['all'],
              'scopes': {
                  'all': {
                      'eventCount': history['scopes']['all']['eventCount'],
                      'eventIds': history['scopes']['all']['eventIds'],
                      'players': players,
                  }
              }
          }
          Path('data/test-scale-history.json').write_text(json.dumps(scale, indent=2)+'\n')
          print('Scale players:', len(players))
          PY

      - name: Run 56-profile scale test with forced interruption and resume
        env: *openai_env
        run: |
          rm -rf data/test-scale-checkpoints data/test-scale-copy.json
          set +e
          python src/run_batched_league_copy.py data/test-scale-history.json \
            --checkpoint-dir data/test-scale-checkpoints \
            --output data/test-scale-copy.json \
            --batch-size 6 \
            --max-new-batches 2
          status=$?
          set -e
          test "$status" -ne 0
          test ! -f data/test-scale-copy.json
          python src/run_batched_league_copy.py data/test-scale-history.json \
            --checkpoint-dir data/test-scale-checkpoints \
            --output data/test-scale-copy.json \
            --batch-size 6
          python - <<'PY'
          import json
          from pathlib import Path
          copy=json.loads(Path('data/test-scale-copy.json').read_text())
          manifest=json.loads(Path('data/test-scale-checkpoints/manifest.json').read_text())
          profiles=copy['scopes']['all']['profiles']
          assert len(profiles) == 56
          assert len({p['name'] for p in profiles}) == 56
          assert manifest['windows'][0]['batchCount'] == 10, manifest
          assert manifest['windows'][0]['reusedBatches'] == 2, manifest
          assert manifest['windows'][0]['newBatches'] == 8, manifest
          print('56-PROFILE RESUME PASS', json.dumps(manifest, indent=2))
          PY

      - name: Prove 56-profile replay is checkpoint-only
        env: *openai_env
        run: |
          python src/run_batched_league_copy.py data/test-scale-history.json \
            --checkpoint-dir data/test-scale-checkpoints \
            --output data/test-scale-copy-replay.json \
            --batch-size 6
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('data/test-scale-checkpoints/manifest.json').read_text())
          assert manifest['newBatches'] == 0, manifest
          assert manifest['reusedBatches'] == 10, manifest
          print('56-PROFILE FULL REUSE PASS')
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batched-league-copy-test
          path: |
            data/test-league-checkpoints/
            data/test-league-copy.json
            data/test-scale-checkpoints/
            data/test-scale-copy.json
          if-no-files-found: warn
