name: Inspect SGT event metadata
on:
  push:
    paths:
      - .github/workflows/sgt-metadata-smoke.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install beautifulsoup4
      - name: Print event card structures and tournament page metadata
        run: |
          python - <<'PY'
          import sys, re, urllib.request
          from bs4 import BeautifulSoup
          sys.path.insert(0,'src')
          from discover import fetch_events_html, parse_events
          raw=fetch_events_html(1825)
          parsed=parse_events(raw,1825,"High Loft")
          print('PARSED RECENT EVENTS',[(x['id'],x['tourName'],x['course'],x['date'],x.get('netWinner'),x.get('grossWinner')) for x in parsed['completed'][:5]])
          by_id={x['id']:x for x in parsed['completed']}
          assert by_id[82812]['tourName']=='Week 8 Muirfield Village',by_id[82812]
          assert by_id[82812]['date']=='2026-11-16',by_id[82812]
          assert by_id[82812]['netWinner']=='KeithK75',by_id[82812]
          assert by_id[80644]['tourName'].strip()=='Week 7 Valhalla',by_id[80644]
          assert by_id[80644]['date']=='2026-11-08',by_id[80644]
          print('NEW CARD PARSER VALIDATION PASSED')
          soup=BeautifulSoup(raw,'html.parser')
          for eid in (82812,80644):
              link=soup.find('a',href=f'/tournament/{eid}')
              if link:
                  card=link.find_parent('div',class_=lambda v:v and 'event-card' in v)
                  print(f'CARD {eid}:',str(card)[:10000] if card else str(link.parent)[:10000])
              req=urllib.request.Request(f'https://simulatorgolftour.com/tournament/{eid}',headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r: h=r.read().decode('utf-8','replace')
              page=BeautifulSoup(h,'html.parser')
              print(f'PAGE {eid} TITLE:',page.title.get_text(' ',strip=True) if page.title else None)
              print(f'PAGE {eid} H1:',[(x.get_text(' ',strip=True)) for x in page.find_all('h1')][:4])
              print(f'PAGE {eid} text first 1200:',page.get_text(' ',strip=True)[:1200])
              for x in page.find_all(string=re.compile('November|NOVEMBER|Nov |2026')):
                  if len(str(x))<180:print(f'DATE NODE {eid}:',str(x).strip()[:180],'PARENT:',str(x.parent)[:450])
          PY
