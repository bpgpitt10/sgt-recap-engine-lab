name: Post-merge variable-hole smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/post-merge-variable-hole-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: pip install beautifulsoup4
      - name: Verify Bougle and Trosper from main
        run: |
          PYTHONPATH=src python - <<'PY'
          from export_tournament import export_tournament
          from analyze_tournament import analyze
          for tid, finishers, holes, net, gross in [
              (65301,18,15,'1234567791234567','1234567791234567'),
              (70248,9,18,'KeithK75','KeithK75'),
          ]:
              raw=export_tournament(tid)
              result=analyze(raw)
              assert len(raw['players']) == finishers
              assert result['validation']['completedPlayers'] == finishers
              assert sorted({p['scorecard']['holesPlayed'] for p in result['players']}) == [holes]
              assert result['winners']['net']['name'] == net
              assert result['winners']['gross']['name'] == gross
              print(tid, result['validation'], result['winners'])
          PY
