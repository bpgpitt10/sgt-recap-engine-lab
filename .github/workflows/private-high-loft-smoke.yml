name: Private High Loft access test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-high-loft-smoke.yml"
      - "src/export_tournament.py"

jobs:
  private-access:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Export known private High Loft tournament
        run: python src/export_tournament.py 55704 --output data/private-test/55704.json

      - name: Validate raw private feeds only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('data/private-test/55704.json').read_text())
          gross = data['leaderboard']['grossOrder']
          net = data['leaderboard']['netOrder']
          players = data['players']

          assert len(players) == 8, f"expected 8 players, got {len(players)}"
          assert len(gross) == 8, f"expected 8 gross leaderboard players, got {len(gross)}"
          assert len(net) == 8, f"expected 8 net leaderboard players, got {len(net)}"
          assert gross[0]['name'] == 'KeithK75', f"expected gross winner KeithK75, got {gross[0]['name']}"
          assert net[0]['name'] == 'KeithK75', f"expected net winner KeithK75, got {net[0]['name']}"

          scorecards = sum(bool(p.get('scorecard')) for p in players)
          stats = sum(bool(p.get('stats')) for p in players)
          shots = sum(bool(p.get('shots')) for p in players)
          assert scorecards == 8, f"expected 8 scorecard feeds, got {scorecards}"
          assert stats == 8, f"expected 8 stats feeds, got {stats}"
          assert shots == 8, f"expected 8 shot feeds, got {shots}"

          print('PRIVATE TOURNAMENT ACCESS PASSED')
          print(json.dumps({
              'tournamentId': data['tournament']['id'],
              'netWinner': net[0]['name'],
              'grossWinner': gross[0]['name'],
              'players': len(players),
              'scorecards': scorecards,
              'stats': stats,
              'shots': shots,
          }, indent=2))
          PY

      - name: Upload private access test package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: high-loft-private-55704
          path: data/private-test/
          if-no-files-found: warn
