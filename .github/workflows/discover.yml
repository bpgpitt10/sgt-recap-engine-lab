name: Discover SGT tour events

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config.json"
      - "requirements.txt"
      - "src/**"
      - ".github/workflows/discover.yml"

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Discover Tour 2370 events
        run: python src/discover.py --write data/discovered-events.json

      - name: Upload discovery result
        uses: actions/upload-artifact@v4
        with:
          name: discovered-events
          path: data/discovered-events.json
