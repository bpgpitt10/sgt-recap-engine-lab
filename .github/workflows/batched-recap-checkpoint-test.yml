name: Batched recap checkpoint integration test
# Regression: batch context is restricted to the requested player subset.

on:
  push:
    branches: [batched-ai-checkpoints-v1]
    paths:
      - "src/write_recap_batched.py"
      - "src/run_batched_high_loft_recap.py"
      - ".github/workflows/batched-recap-checkpoint-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batched-ai-checkpoints-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile batched writer
        run: python -m py_compile src/write_recap_batched.py src/run_batched_high_loft_recap.py
      - name: Require OpenAI test key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY unavailable in engine repo"; exit 1; }
      - name: Generate one batch then intentionally stop
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4-mini-2026-03-17
          OPENAI_FALLBACK_MODEL: gpt-5.6-luna
          OPENAI_TRANSIENT_ATTEMPTS: "6"
          OPENAI_REQUEST_TIMEOUT_SECONDS: "120"
        run: |
          rm -rf data/test-recap-checkpoints data/test-recap-copy.json data/test-recap-copy-second.json data/test-recap-facts.json
          set +e
          python src/run_batched_high_loft_recap.py data/analysis/55704.json \
            --checkpoint-dir data/test-recap-checkpoints \
            --output data/test-recap-copy.json \
            --facts-output data/test-recap-facts.json \
            --batch-size 3 \
            --max-new-batches 1
          status=$?
          set -e
          test "$status" -ne 0
          test -f data/test-recap-checkpoints/55704/batch-001.json
          test ! -f data/test-recap-checkpoints/55704/batch-002.json
          test ! -f data/test-recap-copy.json
          echo "Intentional interruption left exactly one validated checkpoint."
      - name: Resume from checkpoint and finish recap
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4-mini-2026-03-17
          OPENAI_FALLBACK_MODEL: gpt-5.6-luna
          OPENAI_TRANSIENT_ATTEMPTS: "6"
          OPENAI_REQUEST_TIMEOUT_SECONDS: "120"
        run: |
          python src/run_batched_high_loft_recap.py data/analysis/55704.json \
            --checkpoint-dir data/test-recap-checkpoints \
            --output data/test-recap-copy.json \
            --facts-output data/test-recap-facts.json \
            --batch-size 3
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('data/test-recap-checkpoints/55704/manifest.json').read_text())
          copy=json.loads(Path('data/test-recap-copy.json').read_text())
          assert manifest['complete'] is True, manifest
          assert manifest['batchCount'] == 3, manifest
          assert manifest['reusedBatches'] == 1, manifest
          assert manifest['newBatches'] == 2, manifest
          assert len(copy['players']) == 8, len(copy['players'])
          assert len(copy['carnage']) == 8, len(copy['carnage'])
          print('RESUME PASS', json.dumps(manifest, indent=2))
          PY
      - name: Prove a completed rerun uses zero new player batches
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4-mini-2026-03-17
          OPENAI_FALLBACK_MODEL: gpt-5.6-luna
          OPENAI_TRANSIENT_ATTEMPTS: "6"
          OPENAI_REQUEST_TIMEOUT_SECONDS: "120"
        run: |
          python src/run_batched_high_loft_recap.py data/analysis/55704.json \
            --checkpoint-dir data/test-recap-checkpoints \
            --output data/test-recap-copy-second.json \
            --batch-size 3
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('data/test-recap-checkpoints/55704/manifest.json').read_text())
          assert manifest['reusedBatches'] == 3, manifest
          assert manifest['newBatches'] == 0, manifest
          assert Path('data/test-recap-checkpoints/55704/narrative.json').exists()
          print('FULL REUSE PASS', json.dumps(manifest, indent=2))
          PY
      - name: Upload integration-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batched-recap-checkpoint-test
          path: |
            data/test-recap-checkpoints/
            data/test-recap-copy.json
            data/test-recap-copy-second.json
            data/test-recap-facts.json
          if-no-files-found: warn
