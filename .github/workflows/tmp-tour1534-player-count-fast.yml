name: Temporary Tour 1534 player count fast

on:
  issues:
    types: [opened]

jobs:
  count:
    if: github.event.issue.title == 'TEMP TOUR 1534 PLAYER COUNT FAST'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Count completed players across Tour 1534 in parallel
        run: |
          python - <<'PY'
          import statistics
          import sys
          from concurrent.futures import ThreadPoolExecutor, as_completed
          sys.path.insert(0, 'src')
          import export_tournament as ex
          from analyze_tournament import parse_scorecard

          events = [
              (70322, '2026-09-01', 'Comeoniwanalaya Open week 9'),
              (69312, '2026-08-25', 'Up North Trip to Brantford week 8'),
              (68113, '2026-08-17', 'MOVE YO BODY AT KOASATI WEEK 7'),
              (66654, '2026-08-10', 'Dont Dread week 5'),
              (65301, '2026-08-02', 'Gettin Bougie at Bougle 14 week 5'),
              (62971, '2026-07-27', 'Chip in the Dale week 3 and 4'),
              (60713, '2026-07-13', 'Forest Follies week 1 and 2'),
          ]

          def count_event(event):
              tid, date, name = event
              opener = ex.build_opener()
              tournament_url = f'{ex.BASE_URL}/tournament/{tid}'
              with opener.open(tournament_url, timeout=30) as response:
                  response.read()
              gross_html = ex.fetch_text(opener, f'/sgt-api/leaderboard/{tid}', tournament_url)
              net_html = ex.fetch_text(opener, f'/sgt-api/leaderboard/{tid}/net', tournament_url)
              gross = ex.discover_players_from_leaderboard(gross_html, tid)
              net = ex.discover_players_from_leaderboard(net_html, tid)
              players = ex.merge_orders(gross, net)
              completed = 0
              errors = 0
              for p in players:
                  pid = p['id']
                  referer = f'{ex.BASE_URL}/scorecard/{tid}/{pid}'
                  try:
                      html = ex.fetch_text(opener, f'/sgt-api/scorecard/{tid}/{pid}/indv', referer)
                      if parse_scorecard(html).get('complete'):
                          completed += 1
                  except Exception:
                      errors += 1
              return tid, date, name, len(players), completed, errors

          rows = []
          with ThreadPoolExecutor(max_workers=7) as pool:
              futures = [pool.submit(count_event, e) for e in events]
              for future in as_completed(futures):
                  row = future.result()
                  rows.append(row)
                  tid, date, name, raw, completed, errors = row
                  print(f'TOUR1534_EVENT id={tid} date={date} raw={raw} completed={completed} errors={errors} name={name}')

          rows.sort(key=lambda r: r[1], reverse=True)
          raw_counts = [r[3] for r in rows]
          completed_counts = [r[4] for r in rows]
          print('TOUR1534_SUMMARY '
                f'events={len(rows)} '
                f'raw_total={sum(raw_counts)} completed_total={sum(completed_counts)} '
                f'raw_median={statistics.median(raw_counts)} completed_median={statistics.median(completed_counts)} '
                f'raw_min={min(raw_counts)} raw_max={max(raw_counts)} '
                f'completed_min={min(completed_counts)} completed_max={max(completed_counts)}')
          PY
